<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>macaronplayground QR Menu</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #fff6ef;
      --paper: #fffdf8;
      --ink: #2c2524;
      --muted: #746763;
      --pink: #f7a7b6;
      --mint: #bfe8df;
      --lemon: #fff06b;
      --blue: #82c9ec;
      --peach: #ffe3d4;
      --line: rgba(58, 79, 75, .16);
      --shadow: 0 20px 60px rgba(76, 112, 105, .16);
      --radius: 8px;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(120deg, rgba(247, 167, 182, .42) 0 14%, transparent 14% 100%),
        linear-gradient(300deg, rgba(255, 240, 107, .5) 0 11%, transparent 11% 100%),
        linear-gradient(135deg, #e4fbf6 0%, #c9efe7 42%, #fff7eb 100%);
    }

    body.welcome-open {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px clamp(14px, 4vw, 34px) 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 8px 0 18px;
    }

    .brand {
      min-width: 0;
    }

    .brand-logo {
      display: block;
      width: clamp(178px, 34vw, 300px);
      height: auto;
      border-radius: var(--radius);
      filter: drop-shadow(0 12px 18px rgba(70, 100, 94, .18));
    }

    .lang {
      display: inline-grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .55);
      border-radius: 999px;
      padding: 4px;
      flex: 0 0 auto;
    }

    .lang button {
      min-width: 48px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 9px 12px;
      font-weight: 800;
    }

    .lang button[aria-pressed="true"] {
      background: #77c6e9;
      color: #17292d;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(280px, 1.1fr);
      align-items: stretch;
      gap: 18px;
      min-height: 280px;
      margin-bottom: 18px;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(16px, 4vw, 28px) 0;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(42px, 10vw, 86px);
      line-height: .9;
      letter-spacing: 0;
      color: #3b312e;
      text-transform: uppercase;
      text-shadow: 0 10px 20px rgba(255, 255, 255, .62), 0 2px 0 rgba(255, 240, 107, .38);
    }

    .lead {
      max-width: 48ch;
      margin: 18px 0 0;
      color: transparent;
      background: linear-gradient(90deg, #5aa99c, #df8394, #c7ad22, #55a8cf);
      -webkit-background-clip: text;
      background-clip: text;
      font-size: clamp(16px, 2.4vw, 20px);
      line-height: 1.45;
      font-weight: 800;
    }

    .hero-media {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      min-height: 260px;
      background:
        linear-gradient(120deg, rgba(247, 167, 182, .7) 0 16%, transparent 16% 100%),
        linear-gradient(300deg, rgba(255, 240, 107, .75) 0 18%, transparent 18% 100%),
        linear-gradient(135deg, #d5f6f0, #fff8ef);
      box-shadow: var(--shadow);
      padding: clamp(14px, 4vw, 30px);
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 18px 22px rgba(46, 68, 65, .16));
    }

    .hero-media::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .56);
      pointer-events: none;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: 12px;
      padding: 10px 0 14px;
      background: linear-gradient(180deg, rgba(228, 251, 246, .98), rgba(228, 251, 246, .9) 70%, transparent);
      backdrop-filter: blur(12px);
    }

    .search {
      display: grid;
      grid-template-columns: 20px 1fr;
      align-items: center;
      gap: 8px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 16px;
      background: rgba(255, 255, 255, .76);
    }

    .search input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
    }

    .search svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tabs button {
      flex: 0 0 auto;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .65);
      color: #524641;
      padding: 10px 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .tabs button[aria-selected="true"] {
      background: var(--lemon);
      color: #2c2524;
      border-color: rgba(44, 37, 36, .18);
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 22px 0 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(24px, 5vw, 38px);
      line-height: 1;
      letter-spacing: 0;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      overflow: hidden;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .9);
      box-shadow: 0 12px 30px rgba(76, 112, 105, .11);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover,
    .card:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(76, 112, 105, .16);
    }

    .product-button {
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .product-art {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--tile, linear-gradient(135deg, var(--pink), var(--mint)));
    }

    .product-art::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, .58);
    }

    .product-art b {
      position: relative;
      display: grid;
      place-items: center;
      width: min(92px, 38%);
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, .66);
      color: rgba(44, 37, 36, .82);
      font-size: clamp(30px, 6vw, 46px);
      box-shadow: inset 0 -8px 0 rgba(44, 37, 36, .06);
    }

    .product-art.has-photo {
      background: #fff;
    }

    .product-art.has-photo::before {
      display: none;
    }

    .product-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-body {
      display: grid;
      gap: 8px;
      min-height: 118px;
      padding: 12px;
    }

    .product-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .price {
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      padding: 18px;
      background: rgba(44, 37, 36, .36);
      backdrop-filter: blur(10px);
    }

    .modal[open] {
      display: grid;
      place-items: center;
    }

    .dialog {
      width: min(820px, 100%);
      max-height: min(780px, calc(100vh - 36px));
      overflow: auto;
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 30px 80px rgba(44, 37, 36, .28);
    }

    .dialog-grid {
      display: grid;
      grid-template-columns: minmax(220px, .85fr) minmax(0, 1fr);
    }

    .dialog .product-art {
      height: 100%;
      min-height: 320px;
      aspect-ratio: auto;
    }

    .dialog-content {
      padding: clamp(18px, 4vw, 30px);
    }

    .dialog-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .dialog h3 {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1;
      letter-spacing: 0;
    }

    .close {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
    }

    .close svg {
      width: 20px;
      height: 20px;
    }

    .dialog-price {
      margin: 16px 0;
      font-size: 30px;
      font-weight: 900;
    }

    .dialog p {
      color: #5d504b;
      line-height: 1.6;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .chip {
      border-radius: 999px;
      background: rgba(189, 217, 209, .48);
      color: #3e5852;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }

    .welcome {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      place-items: center;
      padding: clamp(14px, 4vw, 30px);
      background: rgba(48, 42, 39, .34);
      backdrop-filter: blur(14px);
    }

    .welcome[hidden] {
      display: none;
    }

    .welcome-card {
      position: relative;
      overflow: hidden;
      width: min(520px, 100%);
      border: 1px solid rgba(255, 255, 255, .74);
      border-radius: 18px;
      background:
        linear-gradient(130deg, rgba(247, 167, 182, .28) 0 22%, transparent 22% 100%),
        linear-gradient(310deg, rgba(191, 232, 223, .44) 0 28%, transparent 28% 100%),
        linear-gradient(180deg, #fffbf4, #fff1e7);
      box-shadow: 0 30px 90px rgba(62, 76, 72, .28);
      text-align: center;
    }

    .welcome-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(70, 92, 87, .16);
      border-radius: 50%;
      background: rgba(255, 255, 255, .82);
      color: #463b37;
      box-shadow: 0 8px 18px rgba(76, 112, 105, .14);
    }

    .welcome-close svg {
      width: 18px;
      height: 18px;
    }

    .welcome-visual {
      position: relative;
      display: grid;
      place-items: end center;
      min-height: clamp(250px, 48vh, 390px);
      padding: 26px 20px 0;
      background:
        var(--welcome-bg, linear-gradient(135deg, rgba(191, 232, 223, .68), rgba(255, 246, 239, .92))),
        radial-gradient(circle at 18% 16%, rgba(247, 167, 182, .42), transparent 40%),
        radial-gradient(circle at 84% 12%, rgba(255, 240, 107, .35), transparent 34%);
    }

    .welcome-visual::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -18px;
      height: 54px;
      border-radius: 50%;
      background: rgba(111, 139, 132, .16);
      filter: blur(12px);
    }

    .welcome-mascot {
      position: relative;
      z-index: 1;
      display: block;
      width: min(86%, 360px);
      max-height: 360px;
      object-fit: contain;
      filter: drop-shadow(0 18px 24px rgba(64, 88, 84, .22));
    }

    .welcome-content {
      position: relative;
      z-index: 1;
      padding: 28px clamp(20px, 6vw, 42px) 34px;
    }

    .welcome-title {
      margin: 0;
      color: #3b312e;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .welcome-title span {
      color: transparent;
      background: linear-gradient(90deg, #6bbfb3, #f19aaa, #d6bd31, #70bfe2);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .welcome-action-box {
      margin-top: 22px;
      padding: 8px;
      border: 1px solid rgba(70, 92, 87, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .74);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 12px 28px rgba(76, 112, 105, .12);
    }

    .welcome-enter {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #bfe8df, #f7a7b6 42%, #fff06b);
      color: #2c2524;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(247, 167, 182, .28);
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
      }

      .hero {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .hero-copy {
        padding-bottom: 0;
      }

      h1 {
        max-width: 9ch;
      }

      .hero-media {
        min-height: 210px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dialog-grid {
        grid-template-columns: 1fr;
      }

      .dialog .product-art {
        min-height: 230px;
      }

      .welcome-card {
        border-radius: 14px;
      }

      .welcome-visual {
        min-height: 240px;
      }
    }

    @media (max-width: 420px) {
      .app {
        padding-inline: 12px;
      }

      .lang button {
        min-width: 42px;
        padding-inline: 9px;
      }

      .grid {
        gap: 10px;
      }

      .product-body {
        min-height: 126px;
        padding: 10px;
      }

      .product-title {
        font-size: 14px;
      }

      .price {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar" aria-label="macaronplayground">
      <nav class="lang" aria-label="Language">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <h1 data-i18n="heroTitle">Menü</h1>
        <p class="lead" data-i18n="heroLead">Macaron dünyasında kahvaltı, tatlı, kahve ve atıştırmalıklar.</p>
      </div>
      <div class="hero-media" aria-hidden="true">
        <img src="assets/macaron-logo.png" alt="">
      </div>
    </section>

    <section class="controls" aria-label="Menu controls">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="search" type="search" autocomplete="off">
      </label>
      <div class="tabs" id="tabs" role="tablist"></div>
    </section>

    <section class="section-title" aria-live="polite">
      <h2 id="categoryTitle">Tümü</h2>
      <p id="countText"></p>
    </section>

    <section class="grid" id="productGrid" aria-label="Menu items"></section>
  </main>

  <section class="welcome" id="welcomePopup" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <article class="welcome-card" style="--welcome-bg: linear-gradient(135deg, rgba(191, 232, 223, .72), rgba(255, 246, 239, .94));">
      <button class="welcome-close" type="button" id="welcomeClose" aria-label="Kapat">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
      <div class="welcome-visual">
        <img class="welcome-mascot" src="assets/welcome-mascot.png" alt="Macaron Playground maskotu">
      </div>
      <div class="welcome-content">
        <h2 class="welcome-title" id="welcomeTitle"><span>Macaron Playground'a</span> Hoş Geldiniz</h2>
        <div class="welcome-action-box">
          <button class="welcome-enter" type="button" id="welcomeEnter">Menüye Bak</button>
        </div>
      </div>
    </article>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <article class="dialog">
      <div class="dialog-grid">
        <div class="product-art" id="modalArt"></div>
        <div class="dialog-content">
          <div class="dialog-top">
            <h3 id="modalTitle"></h3>
            <button class="close" type="button" id="closeModal" aria-label="Close">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
          <div class="dialog-price" id="modalPrice"></div>
          <p id="modalDescription"></p>
          <div class="chips" id="modalChips"></div>
        </div>
      </div>
    </article>
  </div>

  <script>
    const translations = {
      tr: {
        heroTitle: "Menü",
        heroLead: "Macaron dünyasında kahvaltı, tatlı, kahve ve atıştırmalıklar.",
        search: "Menüde ara",
        all: "Tümü",
        itemCount: count => `${count} ürün`,
        category: "Kategori",
        price: "Fiyat",
        detail: "Detay",
        defaultDetail: item => `${item.name.tr} macaronplayground menüsünde ${item.category.tr.toLowerCase()} kategorisinde yer alır.`
      },
      en: {
        heroTitle: "Menu",
        heroLead: "Breakfast, desserts, coffee and bites in a soft macaron-colored world.",
        search: "Search menu",
        all: "All",
        itemCount: count => `${count} items`,
        category: "Category",
        price: "Price",
        detail: "Detail",
        defaultDetail: item => `${item.name.en} is listed under ${item.category.en.toLowerCase()} on the macaronplayground menu.`
      }
    };

    const categories = [
      { id: "all", tr: "Tümü", en: "All" },
      { id: "breakfast", tr: "Kahvaltılar", en: "Breakfast" },
      { id: "toast", tr: "Tostlar", en: "Toasts" },
      { id: "sandwich", tr: "Sandviçler", en: "Sandwiches" },
      { id: "food", tr: "Yiyecekler", en: "Food" },
      { id: "dessert", tr: "Tatlılar", en: "Desserts" },
      { id: "icecream", tr: "Dondurma", en: "Ice Cream" },
      { id: "coffee", tr: "Kahveler", en: "Coffee" },
      { id: "tea", tr: "Çaylar", en: "Tea" },
      { id: "colddrinks", tr: "Soğuk İçecekler", en: "Cold Drinks" }
    ];

    const categoryMap = new Map(categories.map(category => [category.id, category]));

    const palettes = [
      "linear-gradient(135deg, #f7a7b6, #fff06b)",
      "linear-gradient(135deg, #bfe8df, #fff6ef)",
      "linear-gradient(135deg, #82c9ec, #f7a7b6)",
      "linear-gradient(135deg, #fff06b, #bfe8df)",
      "linear-gradient(135deg, #fff6ef, #82c9ec)"
    ];

    const items = [
      item("breakfast", "Kahvaltı Tabağı", "Breakfast Plate", 450, "1 bardak çay ile servis edilir.", "Served with one glass of Turkish tea.", "B", "assets/kahvalti-tabagi.png"),
      item("breakfast", "Serpme Kahvaltı 2 Kişilik", "Mixed Breakfast for Two", 1200, "Rezervasyon gereklidir.", "Reservation required.", "B", "assets/serpme-kahvalti.png"),
      item("toast", "Kaşarlı Tost", "Kashar Cheese Toast", 280, "Sıcak ve çıtır tost.", "Warm, crisp toast.", "T", "assets/kasarli-tost.png"),
      item("toast", "Beyaz Peynirli, Domatesli, Kekikli Tost", "White Cheese, Tomato and Thyme Toast", 280, "Beyaz peynir, domates ve kekik.", "White cheese, tomato and thyme.", "T", "assets/beyaz-peynirli-domatesli-kekikli-tost.png"),
      item("toast", "Karışık Tost", "Mixed Toast", 300, "Klasik karışık tost.", "Classic mixed toast.", "T", "assets/karisik-tost.png"),
      item("sandwich", "Peynirli Sandviç", "Cheese Sandwich", 280, "Peynirli sandviç.", "Cheese sandwich.", "S", "assets/peynirli-sandvic.png"),

      item("colddrinks", "Meyveli Soda", "Fruit Mineral Water", 75, "Meyveli soda.", "Fruit mineral water.", "M"),

      item("colddrinks", "Fanta", "Fanta", 95, "Soğuk içecek.", "Cold drink.", "F"),
      item("colddrinks", "Ice Tea", "Iced Tea", 90, "Soğuk çay.", "Iced tea.", "I"),
      item("colddrinks", "Ayran", "Ayran", 50, "Soğuk ayran.", "Cold ayran.", "A"),
      item("colddrinks", "Capri Sun", "Capri Sun", 75, "Meyveli içecek.", "Fruit drink.", "C")
    ].map((entry, index) => ({
      ...entry,
      id: `${entry.categoryId}-${index}`,
      palette: palettes[index % palettes.length],
      category: categoryMap.get(entry.categoryId)
    }));

    let currentLang = "tr";
    let currentCategory = "all";
    const productGrid = document.querySelector("#productGrid");
    const tabs = document.querySelector("#tabs");
    const search = document.querySelector("#search");
    const categoryTitle = document.querySelector("#categoryTitle");
    const countText = document.querySelector("#countText");
    const modal = document.querySelector("#modal");
    const modalArt = document.querySelector("#modalArt");
    const modalTitle = document.querySelector("#modalTitle");
    const modalPrice = document.querySelector("#modalPrice");
    const modalDescription = document.querySelector("#modalDescription");
    const modalChips = document.querySelector("#modalChips");
    const closeModal = document.querySelector("#closeModal");
    const welcomePopup = document.querySelector("#welcomePopup");
    const welcomeEnter = document.querySelector("#welcomeEnter");
    const welcomeClose = document.querySelector("#welcomeClose");

    function item(categoryId, tr, en, price, descTr, descEn, icon, image = "") {
      return {
        categoryId,
        name: { tr, en },
        price,
        description: { tr: descTr, en: descEn },
        icon,
        image
      };
    }

    function formatPrice(price) {
      return `${price}₺`;
    }

    function applyLanguage() {
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = translations[currentLang][node.dataset.i18n];
      });
      search.placeholder = translations[currentLang].search;
      document.querySelectorAll(".lang button").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === currentLang));
      });
      renderTabs();
      renderProducts();
    }

    function renderTabs() {
      tabs.innerHTML = categories.map(category => `
        <button type="button" role="tab" data-category="${category.id}" aria-selected="${category.id === currentCategory}">
          ${category[currentLang]}
        </button>
      `).join("");
    }

    function filteredItems() {
      const query = search.value.trim().toLocaleLowerCase("tr-TR");
      return items.filter(entry => {
        const matchesCategory = currentCategory === "all" || entry.categoryId === currentCategory;
        const haystack = `${entry.name.tr} ${entry.name.en} ${entry.category.tr} ${entry.category.en}`.toLocaleLowerCase("tr-TR");
        return matchesCategory && (!query || haystack.includes(query));
      });
    }

    function renderProducts() {
      const visible = filteredItems();
      const activeCategory = categoryMap.get(currentCategory);
      categoryTitle.textContent = currentCategory === "all" ? translations[currentLang].all : activeCategory[currentLang];
      countText.textContent = translations[currentLang].itemCount(visible.length);
      productGrid.innerHTML = visible.map(entry => `
        <article class="card">
          <button class="product-button" type="button" data-id="${entry.id}" aria-label="${entry.name[currentLang]}">
            <div class="product-art ${entry.image ? "has-photo" : ""}" style="--tile: ${entry.palette}">
              ${entry.image ? `<img src="${entry.image}" alt="${entry.name[currentLang]}">` : `<b>${entry.icon}</b>`}
            </div>
            <div class="product-body">
              <h3 class="product-title">${entry.name[currentLang]}</h3>
              <div class="product-meta">
                <span>${entry.category[currentLang]}</span>
                <strong class="price">${formatPrice(entry.price)}</strong>
              </div>
            </div>
          </button>
        </article>
      `).join("");
    }

    function openProduct(id) {
      const entry = items.find(product => product.id === id);
      if (!entry) return;
      modalArt.style.setProperty("--tile", entry.palette);
      modalArt.classList.toggle("has-photo", Boolean(entry.image));
      modalArt.innerHTML = entry.image ? `<img src="${entry.image}" alt="${entry.name[currentLang]}">` : `<b>${entry.icon}</b>`;
      modalTitle.textContent = entry.name[currentLang];
      modalPrice.textContent = formatPrice(entry.price);
      modalDescription.textContent = entry.description[currentLang] || translations[currentLang].defaultDetail(entry);
      modalChips.innerHTML = [
        `${translations[currentLang].category}: ${entry.category[currentLang]}`,
        `${translations[currentLang].price}: ${formatPrice(entry.price)}`
      ].map(text => `<span class="chip">${text}</span>`).join("");
      modal.setAttribute("open", "");
      closeModal.focus();
    }

    function hideModal() {
      modal.removeAttribute("open");
    }

    function hideWelcome() {
      welcomePopup.hidden = true;
      document.body.classList.remove("welcome-open");
    }

    document.querySelector(".lang").addEventListener("click", event => {
      const button = event.target.closest("button[data-lang]");
      if (!button) return;
      currentLang = button.dataset.lang;
      applyLanguage();
    });

    tabs.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      currentCategory = button.dataset.category;
      renderTabs();
      renderProducts();
    });

    search.addEventListener("input", renderProducts);

    productGrid.addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      openProduct(button.dataset.id);
    });

    closeModal.addEventListener("click", hideModal);
    modal.addEventListener("click", event => {
      if (event.target === modal) hideModal();
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && !welcomePopup.hidden) hideWelcome();
      if (event.key === "Escape") hideModal();
    });

    applyLanguage();
    document.body.classList.add("welcome-open");
    welcomeEnter.addEventListener("click", hideWelcome);
    welcomeClose.addEventListener("click", hideWelcome);
  </script>
