<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macaron Playground Adisyon</title>
  <meta name="theme-color" content="#bfe8df" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Macaron Adisyon" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Trebuchet MS", "Segoe UI", "system-ui", "sans-serif"]
          },
          colors: {
            cream: "#fff6ef",
            paper: "#fffdf8",
            ink: "#2c2524",
            rose: "#f7a7b6",
            mint: "#bfe8df",
            lemon: "#fff06b",
            sky: "#82c9ec",
            peach: "#ffe3d4"
          },
          boxShadow: {
            soft: "0 18px 50px rgba(76, 112, 105, .16)"
          }
        }
      }
    };
  </script>
  <style>
    body {
      background:
        linear-gradient(120deg, rgba(247, 167, 182, .35) 0 14%, transparent 14% 100%),
        linear-gradient(300deg, rgba(255, 240, 107, .44) 0 12%, transparent 12% 100%),
        linear-gradient(135deg, #e4fbf6 0%, #c9efe7 42%, #fff7eb 100%);
    }

    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .print-area { display: block !important; }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden text-ink">
  <div id="root"></div>
  <div id="print-root" class="print-area hidden"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="./menuData.js"></script>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const STORAGE_KEY = "macaron-playground-adisyon-v2";
    const categoryMap = Object.fromEntries(window.menuCategories.map((category) => [category.id, category]));
    function uid(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function money(value) {
      return new Intl.NumberFormat("tr-TR", {
        style: "currency",
        currency: "TRY",
        maximumFractionDigits: 0
      }).format(value || 0);
    }

    function dateTime(value) {
      return new Intl.DateTimeFormat("tr-TR", {
        dateStyle: "short",
        timeStyle: "short"
      }).format(new Date(value));
    }

    function orderTotal(order) {
      return order.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function itemCount(order) {
      return order.items.reduce((sum, item) => sum + item.quantity, 0);
    }

    function personTotal(order, personId) {
      return order.items
        .filter((item) => item.personId === personId)
        .reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function paidTotal(order) {
      if (!order?.isGroup) return 0;
      const paidPeople = new Set(order.paidPeople || []);
      return (order.people || []).reduce((sum, person) => {
        return paidPeople.has(person.id) ? sum + personTotal(order, person.id) : sum;
      }, 0);
    }

    function remainingTotal(order) {
      return Math.max(0, orderTotal(order) - paidTotal(order));
    }

    function readStore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return {
          openTables: Array.isArray(saved?.openTables) ? saved.openTables : [],
          closedTables: Array.isArray(saved?.closedTables) ? saved.closedTables : []
        };
      } catch {
        return { openTables: [], closedTables: [] };
      }
    }

    function StatBox({ label, value, tone = "bg-paper", onClick, hint = "" }) {
      const Component = onClick ? "button" : "div";
      return (
        <Component onClick={onClick} className={`${tone} rounded-lg border border-black/10 p-4 text-left shadow-sm ${onClick ? "transition active:scale-[.99]" : ""}`}>
          <div className="text-sm font-bold text-stone-500">{label}</div>
          <div className="mt-1 text-2xl font-black tracking-normal">{value}</div>
          {hint && <div className="mt-2 text-xs font-black text-stone-500">{hint}</div>}
        </Component>
      );
    }

    function EmptyState({ title, body }) {
      return (
        <div className="rounded-lg border border-dashed border-black/15 bg-white/55 p-6 text-center">
          <h3 className="text-xl font-black">{title}</h3>
          <p className="mt-2 text-sm font-bold text-stone-500">{body}</p>
        </div>
      );
    }

    function App() {
      const initial = useMemo(readStore, []);
      const [openTables, setOpenTables] = useState(initial.openTables);
      const [closedTables, setClosedTables] = useState(initial.closedTables);
      const [screen, setScreen] = useState("home");
      const [activeTableId, setActiveTableId] = useState(null);
      const [closingTableId, setClosingTableId] = useState(null);
      const [selectedClosedId, setSelectedClosedId] = useState(null);
      const [category, setCategory] = useState("breakfast");
      const [tableName, setTableName] = useState("");
      const [groupTableName, setGroupTableName] = useState("");
      const [firstPersonName, setFirstPersonName] = useState("");
      const [activePersonId, setActivePersonId] = useState(null);
      const [toast, setToast] = useState("");
      const [pendingProduct, setPendingProduct] = useState(null);
      const [summaryUnlocked, setSummaryUnlocked] = useState(false);
      const [summaryPassword, setSummaryPassword] = useState("");
      const [summaryError, setSummaryError] = useState("");

      const activeTable = openTables.find((table) => table.id === activeTableId);
      const closingTable = openTables.find((table) => table.id === closingTableId);
      const selectedClosed = closedTables.find((table) => table.id === selectedClosedId);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ openTables, closedTables }));
      }, [openTables, closedTables]);

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(""), 1400);
        return () => clearTimeout(timer);
      }, [toast]);

      function goHome() {
        setScreen("home");
        setActiveTableId(null);
        setClosingTableId(null);
        setSelectedClosedId(null);
        setCategory("breakfast");
        setSummaryUnlocked(false);
        setSummaryPassword("");
        setSummaryError("");
      }

      function openSummary() {
        setSummaryUnlocked(false);
        setSummaryPassword("");
        setSummaryError("");
        setScreen("summary");
      }

      function unlockSummary(event) {
        event.preventDefault();
        if (summaryPassword === "1425") {
          setSummaryUnlocked(true);
          setSummaryPassword("");
          setSummaryError("");
          return;
        }
        setSummaryError("Şifre hatalı");
      }

      function createTable(event) {
        event.preventDefault();
        const name = tableName.trim();
        if (!name) return;
        const table = { id: uid("table"), name, openedAt: new Date().toISOString(), items: [] };
        setOpenTables((tables) => [table, ...tables]);
        setTableName("");
        setActiveTableId(table.id);
        setScreen("table");
      }

      function createGroupTable(event) {
        event.preventDefault();
        const name = groupTableName.trim();
        const firstName = firstPersonName.trim();
        if (!name || !firstName) return;
        const person = { id: uid("person"), name: firstName };
        const table = {
          id: uid("table"),
          name,
          openedAt: new Date().toISOString(),
          isGroup: true,
          people: [person],
          paidPeople: [],
          items: []
        };
        setOpenTables((tables) => [table, ...tables]);
        setGroupTableName("");
        setFirstPersonName("");
        setActiveTableId(table.id);
        setActivePersonId(person.id);
        setScreen("table");
      }

      function updateActiveTable(updater) {
        setOpenTables((tables) => tables.map((table) => {
          if (table.id !== activeTableId) return table;
          return updater(table);
        }));
      }

      function updateTableById(tableId, updater) {
        setOpenTables((tables) => tables.map((table) => {
          if (table.id !== tableId) return table;
          return updater(table);
        }));
      }

      function addPersonToActiveTable(name) {
        const cleanName = name.trim();
        if (!cleanName || !activeTable?.isGroup) return;
        const person = { id: uid("person"), name: cleanName };
        updateActiveTable((table) => ({
          ...table,
          people: [...(table.people || []), person]
        }));
        setActivePersonId(person.id);
      }

      function requestProduct(product) {
        setPendingProduct(product);
      }

      function addProduct(product) {
        updateActiveTable((table) => {
          const activePerson = table.isGroup
            ? (table.people || []).find((person) => person.id === activePersonId)
            : null;
          if (table.isGroup && !activePerson) return table;
          const found = table.items.find((item) =>
            item.menuId === product.id && (!table.isGroup || item.personId === activePerson.id)
          );
          const categoryName = categoryMap[product.categoryId]?.name || "Menü";
          if (found) {
            return {
              ...table,
              items: table.items.map((item) => item.id === found.id
                ? { ...item, quantity: item.quantity + 1 }
                : item)
            };
          }
          return {
            ...table,
            items: [
              ...table.items,
              {
                id: uid("line"),
                menuId: product.id,
                name: product.name,
                categoryId: product.categoryId,
                categoryName,
                price: product.price,
                quantity: 1,
                lactoseFree: false,
                personId: activePerson?.id || null,
                personName: activePerson?.name || ""
              }
            ]
          };
        });
        setPendingProduct(null);
        const activePerson = activeTable?.isGroup
          ? (activeTable.people || []).find((person) => person.id === activePersonId)
          : null;
        setToast(activePerson ? `${product.name} ${activePerson.name} için eklendi` : `${product.name} eklendi`);
      }

      function changeQuantity(lineId, delta) {
        updateActiveTable((table) => ({
          ...table,
          items: table.items
            .map((item) => item.id === lineId ? { ...item, quantity: item.quantity + delta } : item)
            .filter((item) => item.quantity > 0)
        }));
      }

      function removeLine(lineId) {
        updateActiveTable((table) => ({
          ...table,
          items: table.items.filter((item) => item.id !== lineId)
        }));
      }

      function toggleLactoseFree(lineId) {
        updateActiveTable((table) => ({
          ...table,
          items: table.items.map((item) => item.id === lineId ? { ...item, lactoseFree: !item.lactoseFree } : item)
        }));
      }

      function closeTable() {
        if (!closingTable || !closingTable.items.length) return;
        const total = orderTotal(closingTable);
        const closed = {
          ...closingTable,
          closedAt: new Date().toISOString(),
          total,
          soldCount: itemCount(closingTable)
        };
        setClosedTables((tables) => [closed, ...tables]);
        setOpenTables((tables) => tables.filter((table) => table.id !== closingTable.id));
        setClosingTableId(null);
        setActiveTableId(null);
        setScreen("closed");
      }

      function confirmCloseTable() {
        closeTable();
      }

      function markPersonPaid(personId) {
        if (!closingTable?.isGroup) return;
        updateTableById(closingTable.id, (table) => ({
          ...table,
          paidPeople: Array.from(new Set([...(table.paidPeople || []), personId]))
        }));
      }

      function deleteClosed(id) {
        if (!confirm("Bu kapanmış adisyon silinsin mi?")) return;
        setClosedTables((tables) => tables.filter((table) => table.id !== id));
        if (selectedClosedId === id) setSelectedClosedId(null);
      }

      function printReceipt(order) {
        const html = receiptMarkup(order);
        ReactDOM.createRoot(document.getElementById("print-root")).render(
          <div dangerouslySetInnerHTML={{ __html: html }} />
        );
        setTimeout(() => window.print(), 80);
      }

      const visibleProducts = window.menuItems.filter((item) => category === "all" || item.categoryId === category);
      const daySummary = useMemo(() => buildDaySummary(closedTables), [closedTables]);

      return (
        <main className="no-print mx-auto flex min-h-screen w-full max-w-7xl flex-col px-2 py-2 sm:px-5 sm:py-4 lg:px-8">
          {toast && (
            <div className="fixed left-3 right-3 top-3 z-50 mx-auto max-w-sm rounded-lg border border-black/10 bg-ink px-4 py-3 text-center text-sm font-black text-white shadow-soft">
              {toast}
            </div>
          )}

          <header className="mb-3 flex flex-col gap-2 rounded-lg border border-white/70 bg-white/55 p-2 shadow-soft backdrop-blur sm:mb-4 sm:gap-3 sm:p-4 md:flex-row md:items-center md:justify-between">
            <button type="button" onClick={goHome} className="min-w-0 text-left">
              <p className="text-xs font-black uppercase tracking-normal text-stone-500 sm:text-sm">Adisyon</p>
              <h1 className="text-xl font-black tracking-normal sm:text-4xl">Macaron Playground</h1>
            </button>
            <div className="grid w-full grid-cols-2 gap-2 md:w-auto md:grid-cols-5">
              <TopButton active={screen === "new"} onClick={() => setScreen("new")}>Yeni Masa Aç</TopButton>
              <TopButton active={screen === "groupNew"} onClick={() => setScreen("groupNew")}>Grup Masası Aç</TopButton>
              <TopButton active={screen === "open"} onClick={() => setScreen("open")}>Açık Masalar</TopButton>
              <TopButton active={screen === "closed"} onClick={() => setScreen("closed")}>Kapanmış Masalar</TopButton>
              <TopButton active={screen === "summary"} onClick={openSummary}>Gün Sonu</TopButton>
            </div>
          </header>

          {screen === "home" && (
            <section className="grid flex-1 content-start gap-4">
              <div className="grid grid-cols-2 gap-2 sm:gap-3 lg:grid-cols-4">
                <HomeAction tone="bg-mint" title="Yeni Masa Aç" detail="Yeni bir açık adisyon başlat" onClick={() => setScreen("new")} />
                <HomeAction tone="bg-peach" title="Grup Masası Aç" detail="Kişi kişi hesap takip et" onClick={() => setScreen("groupNew")} />
                <HomeAction tone="bg-rose" title="Açık Masalar" detail={`${openTables.length} açık masa`} onClick={() => setScreen("open")} />
                <HomeAction tone="bg-sky" title="Kapanmış Masalar" detail={`${closedTables.length} kayıt`} onClick={() => setScreen("closed")} />
              </div>
            </section>
          )}

          {screen === "new" && (
            <section className="mx-auto grid w-full max-w-xl gap-4 rounded-lg border border-white/70 bg-paper/90 p-5 shadow-soft">
              <h2 className="text-2xl font-black">Yeni Masa Aç</h2>
              <form onSubmit={createTable} className="grid gap-3">
                <label className="grid gap-2 text-sm font-black text-stone-600">
                  Masa adı
                  <input
                    value={tableName}
                    onChange={(event) => setTableName(event.target.value)}
                    autoFocus
                    className="h-14 rounded-lg border border-black/10 bg-white px-4 text-xl font-black outline-none focus:ring-4 focus:ring-rose/35"
                    placeholder="Örn. Bahçe 4"
                  />
                </label>
                <button className="h-14 rounded-lg bg-ink px-5 text-lg font-black text-white shadow-soft">Masa Oluştur</button>
              </form>
            </section>
          )}

          {screen === "groupNew" && (
            <section className="mx-auto grid w-full max-w-xl gap-4 rounded-lg border border-white/70 bg-paper/90 p-5 shadow-soft">
              <h2 className="text-2xl font-black">Grup Masası Aç</h2>
              <form onSubmit={createGroupTable} className="grid gap-3">
                <label className="grid gap-2 text-sm font-black text-stone-600">
                  Masa adı
                  <input
                    value={groupTableName}
                    onChange={(event) => setGroupTableName(event.target.value)}
                    className="h-14 rounded-lg border border-black/10 bg-white px-4 text-xl font-black outline-none focus:ring-4 focus:ring-rose/35"
                    placeholder="Örn. Grup 1"
                  />
                </label>
                <label className="grid gap-2 text-sm font-black text-stone-600">
                  İlk kişi
                  <input
                    value={firstPersonName}
                    onChange={(event) => setFirstPersonName(event.target.value)}
                    className="h-14 rounded-lg border border-black/10 bg-white px-4 text-xl font-black outline-none focus:ring-4 focus:ring-sky/35"
                    placeholder="Örn. Ayşe"
                  />
                </label>
                <button className="h-14 rounded-lg bg-ink px-5 text-lg font-black text-white shadow-soft">Grup Masası Oluştur</button>
              </form>
            </section>
          )}

          {screen === "open" && (
            <TableList
              tables={openTables}
              onHome={goHome}
              onOpen={(id) => {
                const table = openTables.find((entry) => entry.id === id);
                setActivePersonId(table?.isGroup ? table.people?.[0]?.id || null : null);
                setActiveTableId(id);
                setScreen("table");
              }}
              onClose={(id) => { setActiveTableId(id); setClosingTableId(id); setScreen("close"); }}
            />
          )}

          {screen === "table" && activeTable && (
            <ActiveTable
              table={activeTable}
              category={category}
              setCategory={setCategory}
              products={visibleProducts}
              requestProduct={requestProduct}
              changeQuantity={changeQuantity}
              removeLine={removeLine}
              toggleLactoseFree={toggleLactoseFree}
              activePersonId={activePersonId}
              setActivePersonId={setActivePersonId}
              addPerson={addPersonToActiveTable}
              finishOrder={() => setScreen("open")}
            />
          )}

          {pendingProduct && (
            <ProductConfirm
              product={pendingProduct}
              person={activeTable?.isGroup ? (activeTable.people || []).find((item) => item.id === activePersonId) : null}
              onCancel={() => setPendingProduct(null)}
              onConfirm={() => addProduct(pendingProduct)}
            />
          )}

          {screen === "close" && closingTable && (
            <ClosePreview table={closingTable} onCancel={() => setScreen("table")} onPayPerson={markPersonPaid} onConfirm={confirmCloseTable} />
          )}

          {screen === "closed" && (
            <ClosedTables
              tables={closedTables}
              selected={selectedClosed}
              select={setSelectedClosedId}
              onPrint={printReceipt}
              onDelete={deleteClosed}
              onHome={goHome}
            />
          )}

          {screen === "summary" && (
            summaryUnlocked
              ? <DaySummary summary={daySummary} />
              : (
                <SummaryLock
                  password={summaryPassword}
                  setPassword={setSummaryPassword}
                  error={summaryError}
                  onSubmit={unlockSummary}
                  onHome={goHome}
                />
              )
          )}
        </main>
      );
    }

    function TopButton({ active, children, onClick }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={`min-h-11 rounded-lg border px-2 py-2 text-center text-[12px] font-black leading-tight shadow-sm transition sm:min-h-12 sm:px-4 sm:text-sm ${active ? "border-ink bg-ink text-white" : "border-black/10 bg-white/75 text-ink"}`}
        >
          {children}
        </button>
      );
    }

    function HomeAction({ tone, title, detail, onClick }) {
      return (
        <button type="button" onClick={onClick} className={`${tone} min-h-24 rounded-lg border border-white/70 p-3 text-left shadow-soft transition hover:-translate-y-0.5 sm:min-h-36 sm:p-5`}>
          <span className="block text-lg font-black leading-tight sm:text-2xl">{title}</span>
          <span className="mt-2 block text-sm font-bold text-stone-700 sm:mt-3 sm:text-base">{detail}</span>
        </button>
      );
    }

    function ReturnHomeButton({ onClick }) {
      return (
        <button onClick={onClick} className="mt-3 min-h-12 w-full rounded-lg bg-ink px-4 font-black text-white shadow-soft">
          Ana Ekrana Dön
        </button>
      );
    }

    function TableList({ tables, onOpen, onClose, onHome }) {
      if (!tables.length) {
        return (
          <section className="mx-auto w-full max-w-md">
            <EmptyState title="Açık masa yok" body="Yeni Masa Aç ekranından ilk adisyonu başlatabilirsiniz." />
            <ReturnHomeButton onClick={onHome} />
          </section>
        );
      }

      return (
        <section className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          {tables.map((table) => (
            <article key={table.id} className="rounded-lg border border-black/10 bg-paper/90 p-4 shadow-soft">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <h2 className="text-2xl font-black">{table.name}</h2>
                  <p className="mt-1 text-sm font-bold text-stone-500">{dateTime(table.openedAt)}</p>
                </div>
                <strong className="shrink-0 rounded-full bg-lemon px-2 py-1 text-sm">
                  {table.isGroup ? `Kalan ${money(remainingTotal(table))}` : money(orderTotal(table))}
                </strong>
              </div>
              <div className="mt-4 grid grid-cols-2 gap-2">
                <button onClick={() => onOpen(table.id)} className="h-12 rounded-lg bg-mint px-2 text-sm font-black sm:text-base">Adisyon Aç</button>
                <button onClick={() => onClose(table.id)} disabled={!table.items.length} className="h-12 rounded-lg bg-rose px-2 text-sm font-black sm:text-base disabled:cursor-not-allowed disabled:opacity-45">Masayı Kapat</button>
              </div>
            </article>
          ))}
        </section>
      );
    }

    function ProductConfirm({ product, person, onCancel, onConfirm }) {
      return (
        <div className="fixed inset-0 z-40 grid place-items-end bg-black/25 p-2 sm:place-items-center">
          <section className="w-full max-w-sm rounded-lg border border-black/10 bg-paper p-4 shadow-soft">
            <p className="text-sm font-black text-stone-500">Siparişe eklensin mi?</p>
            <h2 className="mt-1 text-2xl font-black leading-tight">{product.name}</h2>
            {person && (
              <p className="mt-2 w-fit rounded-full bg-mint px-3 py-1 text-sm font-black">{person.name} hesabına</p>
            )}
            <p className="mt-2 text-xl font-black">{money(product.price)}</p>
            <div className="mt-4 grid grid-cols-2 gap-2">
              <button onClick={onCancel} className="min-h-12 rounded-lg bg-white font-black">Vazgeç</button>
              <button onClick={onConfirm} className="min-h-12 rounded-lg bg-ink font-black text-white">Siparişe Ekle</button>
            </div>
          </section>
        </div>
      );
    }

    function ActiveTable({ table, category, setCategory, products, requestProduct, changeQuantity, removeLine, toggleLactoseFree, activePersonId, setActivePersonId, addPerson, finishOrder }) {
      const [newPersonName, setNewPersonName] = useState("");
      const orderedCategories = [
        ...window.menuCategories.filter((item) => item.id !== "all" && item.id !== "cold-drinks"),
        window.menuCategories.find((item) => item.id === "cold-drinks")
      ].filter(Boolean);
      const people = table.people || [];
      const activePerson = people.find((person) => person.id === activePersonId);

      function submitPerson(event) {
        event.preventDefault();
        if (!newPersonName.trim()) return;
        addPerson(newPersonName);
        setNewPersonName("");
      }

      return (
        <section className="grid min-w-0 gap-3 lg:grid-cols-[minmax(0,1fr)_420px] lg:gap-4">
          <div className="order-2 grid min-w-0 content-start gap-2 lg:order-1 lg:gap-3">
            <div className="sticky top-0 z-10 -mx-2 min-w-0 bg-mint/85 px-2 py-2 backdrop-blur sm:mx-0 sm:rounded-lg sm:px-3">
              <div className="grid max-w-full grid-cols-3 gap-1.5 sm:flex sm:flex-wrap sm:gap-2">
                {orderedCategories.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setCategory(item.id)}
                    className={`min-h-9 rounded-lg border px-1.5 py-1 text-[11px] font-black leading-tight sm:min-h-11 sm:rounded-full sm:px-4 sm:text-sm ${category === item.id ? "border-ink bg-lemon" : "border-black/10 bg-white/75"}`}
                  >
                    {item.name}
                  </button>
                ))}
              </div>
            </div>
            <div className="grid min-w-0 gap-2">
              {products.map((product) => (
                <button key={product.id} onClick={() => requestProduct(product)} className="min-h-14 rounded-lg border border-black/10 bg-paper px-3 py-3 text-left shadow-sm transition active:scale-[.99] sm:min-h-16 sm:px-4">
                  <div className="flex min-w-0 items-center justify-between gap-3">
                    <div className="min-w-0">
                      <h3 className="text-base font-black leading-tight sm:text-lg">{product.name}</h3>
                    </div>
                    <strong className="shrink-0 rounded-full bg-lemon px-3 py-1.5 text-sm font-black sm:py-2 sm:text-base">{money(product.price)}</strong>
                  </div>
                </button>
              ))}
            </div>
          </div>
          <aside className="order-1 grid min-w-0 content-start gap-1.5 rounded-lg border border-black/10 bg-white/80 p-2 shadow-soft sm:gap-3 sm:p-3 lg:sticky lg:top-4 lg:order-2">
            <div className="flex items-start justify-between gap-2">
              <div>
                <h2 className="text-lg font-black leading-tight sm:text-2xl">{table.name}</h2>
                <p className="text-xs font-bold text-stone-500 sm:text-sm">{itemCount(table)} ürün</p>
              </div>
              <strong className="shrink-0 rounded-full bg-lemon px-2 py-1.5 text-sm font-black sm:px-3 sm:py-2 sm:text-lg">{money(orderTotal(table))}</strong>
            </div>

            {table.isGroup && (
              <div className="grid gap-2 rounded-lg border border-black/10 bg-mint/35 p-2">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-xs font-black text-stone-600">Sipariş kime?</span>
                  {activePerson && <strong className="rounded-full bg-white px-2 py-1 text-xs">{activePerson.name}</strong>}
                </div>
                <div className="grid grid-cols-2 gap-1.5 sm:grid-cols-3">
                  {people.map((person) => (
                    <button
                      key={person.id}
                      onClick={() => setActivePersonId(person.id)}
                      className={`min-h-10 rounded-lg border px-2 text-sm font-black leading-tight ${activePersonId === person.id ? "border-ink bg-lemon" : "border-black/10 bg-white"}`}
                    >
                      {person.name}
                    </button>
                  ))}
                </div>
                <form onSubmit={submitPerson} className="grid grid-cols-[minmax(0,1fr)_86px] gap-1.5">
                  <input
                    value={newPersonName}
                    onChange={(event) => setNewPersonName(event.target.value)}
                    className="h-11 min-w-0 rounded-lg border border-black/10 bg-white px-3 text-sm font-black outline-none focus:ring-4 focus:ring-sky/30"
                    placeholder="Yeni kişi"
                  />
                  <button className="h-11 rounded-lg bg-sky px-2 text-sm font-black">Ekle</button>
                </form>
              </div>
            )}

            {!table.items.length && <EmptyState title="Adisyon boş" body="Menüden ürüne basarak ekleyin." />}

            <div className="grid max-h-44 gap-1.5 overflow-y-auto pr-1 sm:max-h-64 sm:gap-2 lg:max-h-none lg:overflow-visible lg:pr-0">
              {table.items.map((line) => (
                <article key={line.id} className="rounded-lg border border-black/10 bg-paper p-1.5 sm:p-2">
                  <div className="flex min-w-0 items-center justify-between gap-2">
                    <div className="min-w-0 flex-1">
                      <div className="flex min-w-0 items-center gap-1.5">
                        <h3 className="min-w-0 truncate text-sm font-black leading-tight sm:text-base">{line.name}</h3>
                        <span className="shrink-0 rounded-full bg-lemon px-2 py-0.5 text-xs font-black">x{line.quantity}</span>
                      </div>
                      <p className="mt-0.5 text-[11px] font-bold text-stone-500 sm:text-xs">{money(line.price)} / {money(line.price * line.quantity)}</p>
                      {table.isGroup && line.personName && (
                        <p className="mt-0.5 text-[11px] font-black text-sky">{line.personName}</p>
                      )}
                      {line.categoryId === "coffee" && (
                        <label className="mt-1 flex w-fit items-center gap-1.5 rounded-full bg-white px-2 py-0.5 text-[11px] font-black sm:text-xs">
                          <input
                            type="checkbox"
                            checked={Boolean(line.lactoseFree)}
                            onChange={() => toggleLactoseFree(line.id)}
                          />
                          Laktozsuz süt
                        </label>
                      )}
                    </div>
                    <div className="grid shrink-0 grid-cols-[28px_28px] gap-1">
                      <button onClick={() => changeQuantity(line.id, -1)} className="h-8 rounded-lg bg-mint text-base font-black">-</button>
                      <button onClick={() => changeQuantity(line.id, 1)} className="h-8 rounded-lg bg-mint text-base font-black">+</button>
                      <button onClick={() => removeLine(line.id)} className="col-span-2 h-7 rounded-lg bg-rose text-[11px] font-black">Sil</button>
                    </div>
                  </div>
                </article>
              ))}
            </div>

            <button onClick={finishOrder} className="min-h-11 rounded-lg bg-ink text-sm font-black text-white sm:h-14 sm:text-lg">Siparişi Bitir</button>
          </aside>
        </section>
      );
    }

    function ClosePreview({ table, onCancel, onPayPerson, onConfirm }) {
      const paidPeople = new Set(table.paidPeople || []);
      const remaining = remainingTotal(table);
      return (
        <section className="mx-auto grid w-full max-w-3xl gap-4 rounded-lg border border-black/10 bg-paper/95 p-4 shadow-soft">
          <div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 className="text-2xl font-black">Masayı Kapat: {table.name}</h2>
              <p className="text-sm font-bold text-stone-500">{dateTime(table.openedAt)}</p>
            </div>
            <div className="text-left sm:text-right">
              <p className="text-xs font-black text-stone-500">Genel toplam</p>
              <strong className="block text-3xl font-black">{money(orderTotal(table))}</strong>
              {table.isGroup && <p className="text-sm font-black text-stone-600">Kalan: {money(remaining)}</p>}
            </div>
          </div>
          <ReceiptTable order={table} />
          {table.isGroup && (
            <div className="grid gap-2 rounded-lg border border-black/10 bg-mint/35 p-3">
              <div className="flex items-center justify-between gap-3">
                <h3 className="text-lg font-black">Kişi Hesapları</h3>
                <strong className="rounded-full bg-white px-3 py-1 text-sm">Kalan {money(remaining)}</strong>
              </div>
              <div className="grid gap-2">
                {(table.people || []).map((person) => {
                  const total = personTotal(table, person.id);
                  const paid = paidPeople.has(person.id);
                  return (
                    <article key={person.id} className="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-2 rounded-lg bg-paper p-2">
                      <div className="min-w-0">
                        <h4 className="truncate text-base font-black">{person.name}</h4>
                        <p className="text-xs font-bold text-stone-500">{paid ? "Ödendi" : "Ödenmedi"}</p>
                      </div>
                      <div className="grid justify-items-end gap-1">
                        <strong className="text-lg font-black">{money(total)}</strong>
                        <button
                          onClick={() => onPayPerson(person.id)}
                          disabled={paid || total <= 0}
                          className="min-h-9 rounded-lg bg-ink px-3 text-xs font-black text-white disabled:bg-stone-300 disabled:text-stone-600"
                        >
                          {paid ? "Kapandı" : "Bu Hesabı Kapat"}
                        </button>
                      </div>
                    </article>
                  );
                })}
              </div>
            </div>
          )}
          <div className="grid gap-2 sm:grid-cols-2">
            <button onClick={onCancel} className="h-14 rounded-lg bg-white font-black">Geri Dön</button>
            <button onClick={onConfirm} className="h-14 rounded-lg bg-ink font-black text-white">Onayla ve Kapat</button>
          </div>
        </section>
      );
    }

    function ClosedTables({ tables, selected, select, onPrint, onDelete, onHome }) {
      return (
        <section className="grid gap-4 lg:grid-cols-[360px_minmax(0,1fr)]">
          <div className="grid content-start gap-2">
            {!tables.length && (
              <div>
                <EmptyState title="Kapanmış masa yok" body="Kapatılan adisyonlar burada listelenir." />
                <ReturnHomeButton onClick={onHome} />
              </div>
            )}
            {tables.map((table) => (
              <article key={table.id} className="rounded-lg border border-black/10 bg-paper/90 p-3 shadow-sm">
                <button onClick={() => select(table.id)} className="w-full text-left">
                  <h2 className="text-xl font-black">{table.name}</h2>
                  <p className="text-sm font-bold text-stone-500">{dateTime(table.closedAt)}</p>
                  <strong className="mt-2 block text-lg">{money(table.total)}</strong>
                </button>
                <div className="mt-3 grid grid-cols-2 gap-2">
                  <button onClick={() => onPrint(table)} className="h-11 rounded-lg bg-mint font-black">Fiş</button>
                  <button onClick={() => onDelete(table.id)} className="h-11 rounded-lg bg-rose font-black">Sil</button>
                </div>
              </article>
            ))}
          </div>
          <div className="rounded-lg border border-black/10 bg-white/75 p-4 shadow-soft">
            {selected ? (
              <div className="grid gap-4">
                <div className="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                  <div>
                    <h2 className="text-2xl font-black">{selected.name}</h2>
                    <p className="text-sm font-bold text-stone-500">Kapanış: {dateTime(selected.closedAt)}</p>
                  </div>
                  <strong className="text-3xl font-black">{money(selected.total)}</strong>
                </div>
                <ReceiptTable order={selected} />
                <button onClick={() => onPrint(selected)} className="h-14 rounded-lg bg-ink text-lg font-black text-white">Fiş Çıktısı Al</button>
              </div>
            ) : (
              <div>
                <EmptyState title="Detay seçilmedi" body="Soldaki kapanmış adisyonlardan birini açın." />
                <ReturnHomeButton onClick={onHome} />
              </div>
            )}
          </div>
        </section>
      );
    }

    function ReceiptTable({ order }) {
      return (
        <div className="rounded-lg border border-black/10 bg-white">
          <div className="grid gap-2 p-2 sm:hidden">
            {order.items.map((item) => (
              <article key={item.id} className="rounded-lg border border-black/10 bg-paper p-3">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <h3 className="font-black leading-tight">{item.name}</h3>
                    {item.personName && <div className="mt-1 text-xs font-bold text-stone-500">{item.personName}</div>}
                    {item.lactoseFree && <div className="mt-1 text-xs font-bold text-stone-500">Laktozsuz süt</div>}
                  </div>
                  <strong className="shrink-0 rounded-full bg-lemon px-3 py-1 text-sm">{item.quantity} adet</strong>
                </div>
                <div className="mt-3 grid grid-cols-2 gap-2 text-sm font-bold">
                  <span className="text-stone-500">Birim</span>
                  <span className="text-right">{money(item.price)}</span>
                  <span className="text-stone-500">Ara Toplam</span>
                  <span className="text-right font-black">{money(item.price * item.quantity)}</span>
                </div>
              </article>
            ))}
            <div className="rounded-lg bg-lemon/70 p-3 text-right text-xl font-black">
              Genel Toplam: {money(orderTotal(order))}
            </div>
          </div>
          <div className="hidden overflow-x-auto sm:block">
            <table className="w-full min-w-[560px] text-left">
              <thead className="bg-mint/60 text-sm">
                <tr>
                  <th className="p-3">Ürün</th>
                  <th className="p-3 text-right">Adet</th>
                  <th className="p-3 text-right">Birim Fiyat</th>
                  <th className="p-3 text-right">Ara Toplam</th>
                </tr>
              </thead>
              <tbody>
                {order.items.map((item) => (
                  <tr key={item.id} className="border-t border-black/10">
                    <td className="p-3">
                      <strong>{item.name}</strong>
                      {item.personName && <div className="text-xs font-bold text-stone-500">{item.personName}</div>}
                      {item.lactoseFree && <div className="text-xs font-bold text-stone-500">Laktozsuz süt</div>}
                    </td>
                    <td className="p-3 text-right font-bold">{item.quantity}</td>
                    <td className="p-3 text-right font-bold">{money(item.price)}</td>
                    <td className="p-3 text-right font-black">{money(item.price * item.quantity)}</td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
              <tr className="border-t-2 border-black/20 bg-lemon/70">
                <td className="p-3 text-xl font-black" colSpan="3">Genel Toplam</td>
                <td className="p-3 text-right text-xl font-black">{money(orderTotal(order))}</td>
              </tr>
            </tfoot>
          </table>
          </div>
        </div>
      );
    }

    function SummaryLock({ password, setPassword, error, onSubmit, onHome }) {
      return (
        <section className="mx-auto grid w-full max-w-md gap-4 rounded-lg border border-black/10 bg-paper/95 p-5 shadow-soft">
          <div>
            <h2 className="text-2xl font-black">Gün Sonu</h2>
            <p className="mt-1 text-sm font-bold text-stone-500">Bu ekran şifreyle açılır.</p>
          </div>
          <form onSubmit={onSubmit} className="grid gap-3">
            <label className="grid gap-2 text-sm font-black text-stone-600">
              Şifre
              <input
                value={password}
                onChange={(event) => setPassword(event.target.value)}
                inputMode="numeric"
                type="password"
                autoFocus
                className="h-14 rounded-lg border border-black/10 bg-white px-4 text-2xl font-black tracking-normal outline-none focus:ring-4 focus:ring-lemon/45"
                placeholder="••••"
              />
            </label>
            {error && <p className="rounded-lg bg-rose/60 px-3 py-2 text-sm font-black">{error}</p>}
            <button className="h-14 rounded-lg bg-ink px-5 text-lg font-black text-white shadow-soft">Giriş Yap</button>
          </form>
          <button onClick={onHome} className="h-12 rounded-lg bg-white font-black">Ana Ekrana Dön</button>
        </section>
      );
    }

    function DaySummary({ summary }) {
      const [showProducts, setShowProducts] = useState(false);

      return (
        <section className="grid gap-4">
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            <StatBox label="Toplam Ciro" value={money(summary.revenue)} tone="bg-lemon" />
            <StatBox
              label="Satılan Ürün"
              value={summary.soldCount}
              tone="bg-mint"
              hint="Detay için dokun"
              onClick={() => setShowProducts((value) => !value)}
            />
            <StatBox label="En Çok Satan Ürün" value={summary.topProduct || "-"} tone="bg-rose" />
            <StatBox label="En Çok Satan Kategori" value={summary.topCategory || "-"} tone="bg-sky" />
          </div>
          {showProducts && (
            <div className="rounded-lg border border-black/10 bg-white/80 p-3 shadow-soft">
              <h2 className="text-xl font-black">Satılan Ürün Detayı</h2>
              {summary.productRows.length ? (
                <div className="mt-3 grid gap-2">
                  {summary.productRows.map((item) => (
                    <div key={item.name} className="flex items-center justify-between gap-3 rounded-lg bg-paper p-3">
                      <span className="min-w-0 font-black leading-tight">{item.name}</span>
                      <strong className="shrink-0 rounded-full bg-lemon px-3 py-1">{item.quantity} adet</strong>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="mt-2 text-sm font-bold text-stone-500">Henüz satılan ürün yok.</p>
              )}
            </div>
          )}
          <div className="rounded-lg border border-black/10 bg-paper/90 p-4 shadow-soft">
            <h2 className="text-2xl font-black">Gün Sonu Toplamı</h2>
            <p className="mt-2 text-sm font-bold text-stone-500">Hesaplama kapanmış masalardan yapılır.</p>
          </div>
        </section>
      );
    }

    function buildDaySummary(closedTables) {
      const products = {};
      const categories = {};
      let revenue = 0;
      let soldCount = 0;

      closedTables.forEach((table) => {
        revenue += table.total || orderTotal(table);
        table.items.forEach((item) => {
          soldCount += item.quantity;
          products[item.menuId] = products[item.menuId] || { name: item.name, quantity: 0 };
          products[item.menuId].quantity += item.quantity;
          categories[item.categoryId] = categories[item.categoryId] || { name: item.categoryName, quantity: 0 };
          categories[item.categoryId].quantity += item.quantity;
        });
      });

      const topProduct = Object.values(products).sort((a, b) => b.quantity - a.quantity)[0];
      const topCategory = Object.values(categories).sort((a, b) => b.quantity - a.quantity)[0];
      const productRows = Object.values(products).sort((a, b) => b.quantity - a.quantity || a.name.localeCompare(b.name, "tr"));

      return {
        revenue,
        soldCount,
        topProduct: topProduct ? `${topProduct.name} (${topProduct.quantity})` : "",
        topCategory: topCategory ? `${topCategory.name} (${topCategory.quantity})` : "",
        productRows
      };
    }

    function receiptMarkup(order) {
      const rows = order.items.map((item) => `
        <tr>
          <td>${escapeHtml(item.name)}${item.personName ? `<small>${escapeHtml(item.personName)}</small>` : ""}${item.lactoseFree ? `<small>Laktozsuz süt</small>` : ""}</td>
          <td>${item.quantity}</td>
          <td>${money(item.price)}</td>
          <td>${money(item.price * item.quantity)}</td>
        </tr>
      `).join("");

      return `
        <style>
          .receipt { width: 80mm; margin: 0 auto; color: #111; font-family: Arial, sans-serif; }
          .receipt h1 { margin: 0 0 4mm; font-size: 18px; text-align: center; }
          .receipt p { margin: 0 0 2mm; font-size: 12px; }
          .receipt table { width: 100%; border-collapse: collapse; font-size: 11px; }
          .receipt th, .receipt td { border-bottom: 1px solid #ddd; padding: 5px 2px; text-align: right; vertical-align: top; }
          .receipt th:first-child, .receipt td:first-child { text-align: left; }
          .receipt small { display: block; color: #555; margin-top: 2px; }
          .receipt .total { font-size: 16px; font-weight: 800; text-align: right; margin-top: 4mm; }
        </style>
        <section class="receipt">
          <h1>Macaron Playground</h1>
          <p><strong>Masa:</strong> ${escapeHtml(order.name)}</p>
          <p><strong>Açılış:</strong> ${dateTime(order.openedAt)}</p>
          <p><strong>Kapanış:</strong> ${dateTime(order.closedAt || new Date().toISOString())}</p>
          <table>
            <thead><tr><th>Ürün</th><th>Adet</th><th>Birim</th><th>Toplam</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="total">Genel Toplam: ${money(orderTotal(order))}</div>
        </section>
      `;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
